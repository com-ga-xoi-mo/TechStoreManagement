services:
  postgres:
    image: postgres:16-alpine
    container_name: techstore_postgres
    restart: always
    environment:
      POSTGRES_DB: techstore_db
      POSTGRES_USER: techstore_user
      POSTGRES_PASSWORD: TechStorePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstore_user -d techstore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
